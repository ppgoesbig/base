name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/NetSpeedBar.app NetSpeedBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedBar
          path: NetSpeedBar.zip
