name: PureFrame

# Tests run on every push that touches PureFrame. The site deploys to GitHub
# Pages from the default branch (enable Pages first: Settings > Pages >
# Source: GitHub Actions).
on:
  push:
    paths:
      - 'pureframe/**'
      - '.github/workflows/pureframe.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pureframe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test pureframe/test/*.test.js
      - name: Build
        run: node pureframe/scripts/build.mjs

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: node pureframe/scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pureframe/dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
